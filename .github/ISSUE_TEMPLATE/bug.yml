name: Bug
description: The tool crashed or did something it shouldn't
labels: ["bug"]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `tvbox-scan version`
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Computer OS and Python version
      placeholder: Windows 11, Python 3.12
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command you ran
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: Include `tvbox-scan doctor` output. Mask IP addresses if you want.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
