name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[ui]" "ruff==0.17.4" "mypy==2.4.1"
      - name: ruff
        run: ruff check --output-format=github .
      - name: mypy
        run: mypy

  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[ui]"
      - name: Unit and UI tests
        run: python -m unittest discover -s tests -v

  install-from-git:
    # What an AI agent or a user does from the README: a non-editable install, then the CLI.
    name: Fresh install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package (not editable)
        run: python -m pip install ".[ui]"
      - name: CLI works outside the source tree
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          tvbox-scan version
          tvbox-scan export-blocklist --format domains | head -3
          python -c "import tvbox_scanner.ui.app"
          # adb is not installed on runners, so doctor must exit 1 and say so
          if tvbox-scan doctor; then echo "doctor should fail without adb"; exit 1; fi

  install-scripts:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: scripts/install.sh
        if: runner.os != 'Windows'
        run: sh scripts/install.sh && .venv/bin/tvbox-scan version
      - name: scripts/install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts\install.ps1
          .\.venv\Scripts\tvbox-scan.exe version
