name: Update IOCs

# Weekly: pull new domain/IP/hash IOCs from ThreatFox and open a pull request for a
# human to review. Nothing is merged automatically.
#
# Setup (repository Settings):
#   Secrets  > THREATFOX_AUTH_KEY  free key from https://auth.abuse.ch/
#   Variables > THREATFOX_TAGS     space-separated "tag:file" pairs, e.g.
#                                  "SomeTag:vo1d.json OtherTag:badbox2.json"
#              Check each tag on https://threatfox.abuse.ch/browse/ first: tags are free text,
#              and a wrong one pulls in unrelated malware.
#   Actions > General > "Allow GitHub Actions to create and approve pull requests"

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    if: vars.THREATFOX_TAGS != ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch from ThreatFox
        env:
          THREATFOX_AUTH_KEY: ${{ secrets.THREATFOX_AUTH_KEY }}
          THREATFOX_TAGS: ${{ vars.THREATFOX_TAGS }}
        run: |
          for pair in $THREATFOX_TAGS; do
            tag="${pair%%:*}"; file="${pair#*:}"
            case "$file" in */*|..*) echo "bad file name: $file"; exit 1;; esac
            python tools/update_iocs.py --tag "$tag" --file "src/tvbox_scanner/data/iocs/$file"
          done
      - name: Check the files still load
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          THREATFOX_TAGS: ${{ vars.THREATFOX_TAGS }}
        run: |
          if git diff --quiet; then echo "No new IOCs."; exit 0; fi
          branch="ioc-update-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Update IOCs from ThreatFox"
          git push -u origin "$branch"
          gh pr create --title "Update IOCs from ThreatFox ($(date +%Y-%m-%d))" --body \
            "Automated weekly pull from ThreatFox tags: \`$THREATFOX_TAGS\`.

          Before merging, spot-check new entries on threatfox.abuse.ch. Shared hosting or CDN IPs and domains
          would flag innocent boxes and end up in people's block lists."
